<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Raw Muscle Gym Tracker</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Raw Muscle" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />

    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="install-gate" class="install-gate" hidden></div>

    <header class="topbar">
      <h1 id="topbar-title">Train</h1>
      <div class="topbar-end">
        <span id="topbar-note" class="topbar-note"></span>
        <button class="icon-btn" data-action="open-settings" aria-label="Settings">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- ------------------------------------------------ Train -->
      <section id="view-train" class="view">
        <div id="train-idle" class="stack">
          <div id="current-session" class="card current-session" hidden></div>
          <div class="card">
            <h2>Start a workout</h2>
            <p class="muted">
              Pick a plan, or start a new session and add exercises as you go.
            </p>
            <div class="stack" style="margin-top: 20px">
              <button class="btn ghost" data-action="start-freestyle">
                New session
              </button>
              <button class="btn" data-action="select-plan">Select plan</button>
            </div>
          </div>
          <div id="stats" class="card"></div>
        </div>

        <div id="train-active" class="stack" hidden>
          <div class="card session-head">
            <div>
              <h2 id="session-name"></h2>
              <span class="muted" id="session-meta"></span>
            </div>
            <button class="btn danger small" data-action="finish">
              Finish
            </button>
          </div>
          <div id="exercise-list" class="stack" data-drag-list="session"></div>
          <button class="btn ghost" data-action="add-exercise">
            + Add exercise
          </button>
          <button class="btn subtle" data-action="discard">
            Discard session
          </button>
        </div>
      </section>

      <!-- ------------------------------------------------ Plans -->
      <section id="view-plans" class="view" hidden>
        <div id="plan-list" class="stack"></div>
        <div class="stack tight page-foot">
          <div class="row">
            <button class="btn ghost" data-action="new-folder">+ New folder</button>
            <button class="btn ghost" data-action="new-block">+ New block</button>
          </div>
          <button class="btn" data-action="new-plan">+ New plan</button>
          <div class="row">
            <button class="btn small ghost" data-action="export-plans">
              Export plans
            </button>
            <button class="btn small ghost" data-action="import-plans">
              Import plans
            </button>
          </div>
          <input id="import-plans-file" type="file" hidden />
        </div>
      </section>

      <!-- ------------------------------------------------ History -->
      <section id="view-history" class="view" hidden>
        <div style="margin-bottom: 12px">
          <label for="history-filter">Exercise</label>
          <select id="history-filter"></select>
          <label id="hide-warmups-row" class="check" hidden>
            <input type="checkbox" id="hide-warmups" />
            Hide warm-up sets
          </label>
        </div>
        <div id="history-list" class="stack"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="train">
        <span class="tab-icon">&#9679;</span><span>Train</span>
      </button>
      <button class="tab" data-view="plans">
        <span class="tab-icon">&#9635;</span><span>Plans</span>
      </button>
      <button class="tab" data-view="history">
        <span class="tab-icon">&#9201;</span><span>History</span>
      </button>
    </nav>

    <!-- Bottom sheet used for every picker and form on this screen size. -->
    <div id="sheet" class="sheet-backdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="btn subtle small" data-action="close-sheet">
            Close
          </button>
        </div>
        <div id="sheet-body" class="sheet-body"></div>
        <!-- The sheet's main button, kept in view above the keyboard. -->
        <div id="sheet-foot" class="sheet-foot" hidden></div>
      </div>
    </div>

    <!-- Drop target shown while a plan or block is held on the Plans tab. -->
    <div id="unfile" class="unfile" data-drop="none" hidden>Drop here for no folder</div>

    <!-- Drop target shown while an exercise is being dragged. -->
    <div id="trash" class="trash" hidden>
      <svg
        viewBox="0 0 24 24"
        width="26"
        height="26"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6M10 11v6M14 11v6"
        />
      </svg>
      <span>Drop here to delete</span>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!-- Backup file picker for Import data in the settings sheet. -->
    <input id="import-file" type="file" hidden />

    <script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="exercises.js"></script>
    <script src="app.js"></script>
  </body>
</html>
